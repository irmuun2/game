<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" role="img" aria-label="Дэлхийн гадарга">
  <!-- «i» үсэг: дээд цэг нь дэлхийн бөмбөрцөг, бие нь физик ба нийгмийн газар зүйн давхаргууд. -->
  <defs>
    <radialGradient id="lg-sea" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#9fd3ef"/><stop offset=".5" stop-color="#2f7fb5"/><stop offset="1" stop-color="#0e3b5f"/></radialGradient>
    <linearGradient id="lg-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff1f9"/><stop offset="1" stop-color="#a9d4ea"/></linearGradient>
    <clipPath id="lg-dot"><circle cx="60" cy="34" r="26"/></clipPath>
    <clipPath id="lg-stem"><rect x="36" y="70" width="48" height="122" rx="13"/></clipPath>
  </defs>

  <!-- Дэлхийн бөмбөрцөг: тив, туйлын мөс, өргөрөг, уртраг -->
  <circle cx="60" cy="34" r="26" fill="url(#lg-sea)"/>
  <g clip-path="url(#lg-dot)">
    <path d="M38 16 C44 12 50 16 49 22 C48 27 43 28 44 34 C45 40 50 44 48 52 C46 58 41 56 40 50 C39 44 35 40 36 33 C36 27 34 21 38 16 Z" fill="#5d9d4c"/>
    <path d="M62 14 C70 10 82 14 86 22 C88 28 82 30 78 28 C74 27 72 31 74 35 C77 40 76 48 70 54 C66 58 62 54 63 48 C64 43 60 40 58 36 C56 31 60 30 61 26 C62 22 57 18 62 14 Z" fill="#5d9d4c"/>
    <path d="M64 36 C68 34 72 37 71 42 C69 45 65 44 64 40 Z" fill="#d9b05a"/>
    <path d="M70 18 C74 16 79 18 80 22 C77 24 72 23 70 18 Z" fill="#a9622f"/>
    <ellipse cx="60" cy="9" rx="15" ry="4.5" fill="#eef3f0" opacity=".9"/>
    <g fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1">
      <ellipse cx="60" cy="34" rx="11" ry="26"/><ellipse cx="60" cy="34" rx="20" ry="26"/>
      <path d="M34 34 H86 M37.5 21 H82.5 M37.5 47 H82.5"/>
    </g>
    <ellipse cx="49" cy="22" rx="8" ry="5" fill="#ffffff" opacity=".22"/>
  </g>
  <circle cx="60" cy="34" r="26" fill="none" stroke="#eef3f0" stroke-width="2.5"/>

  <!-- Бие: дээрээс доош тэнгэр, уул ба хот, тал ба гэр, хөрс-чулуулаг, далай -->
  <g clip-path="url(#lg-stem)">
    <rect x="36" y="70" width="48" height="48" fill="url(#lg-sky)"/>
    <circle cx="47" cy="80" r="4" fill="#f6c343"/>
    <!-- Физик: уул, мөнх цас -->
    <path d="M34 118 L50 86 L57 97 L61 91 L72 118 Z" fill="#a9622f"/>
    <path d="M45.6 94.8 L50 86 L54.4 92.6 L51.6 93.8 L49.4 91.6 Z" fill="#eef3f0"/>
    <!-- Нийгэм: хотын барилга, үйлдвэрийн яндан -->
    <rect x="65" y="99" width="8" height="19" fill="#2c3e50"/>
    <rect x="74" y="92" width="9" height="26" fill="#34495e"/>
    <rect x="80" y="84" width="3" height="10" fill="#5b6670"/>
    <circle cx="83" cy="80" r="2.6" fill="#ffffff" opacity=".75"/>
    <g fill="#f0cd80"><rect x="67" y="102" width="2" height="2.4"/><rect x="70" y="102" width="2" height="2.4"/><rect x="67" y="107" width="2" height="2.4"/><rect x="70" y="107" width="2" height="2.4"/><rect x="76" y="96" width="2" height="2.4"/><rect x="79.5" y="96" width="2" height="2.4"/><rect x="76" y="101" width="2" height="2.4"/><rect x="79.5" y="101" width="2" height="2.4"/><rect x="76" y="106" width="2" height="2.4"/></g>
    <!-- Тал нутаг: гол, мод (физик), гэр (нийгэм) -->
    <path d="M36 117 Q48 113 60 116 T84 115 V146 H36 Z" fill="#5d9d4c"/>
    <path d="M38 146 C46 139 53 136 56 129 C58 123 65 120 72 118" fill="none" stroke="#86c1e0" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 132 h15 v-6.5 q-7.5 -8 -15 0 z" fill="#f4f1e8"/>
    <path d="M38.8 126 Q47.5 115.5 56.2 126" fill="none" stroke="#c9c2b0" stroke-width="1.2"/>
    <rect x="45.8" y="127.5" width="3.4" height="4.5" fill="#c4492f"/>
    <circle cx="47.5" cy="119.8" r="1.3" fill="#c9c2b0"/>
    <g fill="#2b6a41"><path d="M70 124 l4 9 h-8 z"/><path d="M77 121 l4 9 h-8 z"/><path d="M73 131 l4 9 h-8 z"/></g>
    <!-- Хөрс, чулуулгийн давхарга, ашигт малтмал -->
    <path d="M36 146 H84 V170 H36 Z" fill="#d9b05a"/>
    <path d="M36 154 Q48 151 60 154 T84 154 V170 H36 Z" fill="#a9622f"/>
    <path d="M36 162 Q48 159 60 162 T84 162 V170 H36 Z" fill="#8b4a29"/>
    <path d="M68 156 l3 3 -3 3 -3 -3 z" fill="#b9a3ec"/>
    <!-- Далай -->
    <path d="M36 170 Q42 167 48 170 T60 170 T72 170 T84 170 V192 H36 Z" fill="#1d6493"/>
    <path d="M40 178 q4 -3 8 0 t8 0 M58 185 q4 -3 8 0 t8 0" fill="none" stroke="#86c1e0" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <rect x="36" y="70" width="48" height="122" rx="13" fill="none" stroke="#eef3f0" stroke-width="2.5"/>
</svg>
